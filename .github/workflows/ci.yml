name: CI

# Quality gate for the Propolis workspace: formatting, lint (clippy deny-warnings), and the full
# test suite against a real PostgreSQL. Runs on every push and pull request so nothing merges
# un-gated. The toolchain is pinned via rust-toolchain.toml (matched rustc + clippy + rustfmt).
#
# NOTE: action refs are version tags here; pinning them (and the postgres image) to commit/digest
# SHAs is the "harden dependency vetting" follow-up card.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # sqlx::test provisions a fresh database per test on this server (superuser, trust auth).
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain + components
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests (serial, frozen lockfile)
        run: cargo test --workspace --locked -- --test-threads=1
