# Installed as /etc/tmpfiles.d/propolis.conf by deploy/provision.sh, which also applies it with
# systemd-tmpfiles --create; systemd applies it again at every boot, since /run starts empty.
#
# /run/propolis-witness holds runtime state of the root alerting code. It comes from here and not
# from a unit's RuntimeDirectory=: systemd removes a oneshot's RuntimeDirectory= when that unit
# stops, which would delete the directory under any other unit using it. Group propolis may enter
# and read it, never write it: only root writes there.
#
# /run/motd.d is the directory pam_motd shows at login. A stock Debian host may not have it, and a
# unit under ProtectSystem=strict cannot create it.
d /run/propolis-witness 0750 root propolis -
d /run/motd.d 0755 root root -
