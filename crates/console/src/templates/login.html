{% extends "base.html" %}
{% block title %}Sign in - Propolis{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<div class="login-shell">
  <div class="login-card">
    <h1>Propolis</h1>
    {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="password" name="password" placeholder="Operator password" autocomplete="current-password" autofocus required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
