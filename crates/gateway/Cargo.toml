[package]
name = "gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
collector-wire = { path = "../collector-wire" }
sensor-framework = { path = "../sensor-framework" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "fs", "time"] }
tokio-rustls = "0.26.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
provision-certs = { path = "../provision-certs" }
tempfile = "3.27.0"
rustls-pemfile = "2.2.0"
