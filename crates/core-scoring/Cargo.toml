[package]
name = "core-scoring"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = { version = "1.42.1", features = ["serde"] }
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros", "rust_decimal", "chrono", "uuid", "json"] }
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
proptest = "1.11.0"
