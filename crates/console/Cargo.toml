[package]
name = "console"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = { version = "0.4.45", features = ["serde"] }
core-scoring = { path = "../core-scoring" }
futures = { version = "0.3.32", default-features = false, features = ["std", "async-await"] }
hex = "0.4.3"
hmac = "0.13.0"
minijinja = "2.21.0"
rand = { version = "0.10.2", features = ["std"] }
review = { path = "../review" }
rust_decimal = { version = "1.42.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros", "rust_decimal", "chrono", "json"] }
subtle = "2.6.1"
thiserror = "2.0.18"
time = "0.3.54"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
http-body-util = "0.1.4"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1", features = ["v7"] }
