<!doctype html>
<html lang="en" data-theme="graphite">
<head>
<meta charset="utf-8">
<script>
/* Apply the stored theme before first paint so there is no flash. No stored preference (or a private
   window that throws) keeps the server default, Graphite. Kept tiny and dependency-free. */
(function () {
  try {
    var t = localStorage.getItem('propolis-theme');
    if (t === 'cream' || t === 'system' || t === 'hacker' || t === 'graphite') {
      document.documentElement.setAttribute('data-theme', t);
    }
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Propolis console{% endblock %}</title>
<meta name="csrf-token" content="{{ csrf_token|default('') }}">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 L4 6 L4 12 Q4 18 12 22 Q20 18 20 12 L20 6 Z' fill='%23eaa72c'/%3E%3C/svg%3E">
<style>
/* ============================================================================
   Propolis console - "watch floor".
   One operator watching one honeypot. The interface's whole job is to answer
   "does anything need me right now?" and otherwise stay quiet.

   THESIS: temperature = attention. The floor is cool slate; a scan is just
   noise and is rendered in the same grey as faint text. Warmth is spent only
   on things that want the operator - amber (review), orange (hands on the
   keyboard), red (live intrusion) - and green means handled. Colour is
   meaning here, never decoration: a grey row is a fine row.

   Token NAMES are kept stable (inline styles in several templates read
   --good / --alert-text / etc.); this file re-values them and adds the
   severity ramp + elevation on top.
   ============================================================================ */
/* Self-hosted fonts (no third-party font request from the deployed box). Served from the public
   /assets/fonts route as Latin-subset woff2; Hanken carries a full weight axis in one file. */
@font-face { font-family:"Hanken Grotesk"; src:url("/assets/fonts/hanken-grotesk-var.woff2") format("woff2"); font-weight:100 900; font-style:normal; font-display:swap; }
@font-face { font-family:"IBM Plex Mono"; src:url("/assets/fonts/ibm-plex-mono-400.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:swap; }
@font-face { font-family:"IBM Plex Mono"; src:url("/assets/fonts/ibm-plex-mono-500.woff2") format("woff2"); font-weight:500; font-style:normal; font-display:swap; }
@font-face { font-family:"IBM Plex Mono"; src:url("/assets/fonts/ibm-plex-mono-600.woff2") format("woff2"); font-weight:600; font-style:normal; font-display:swap; }

/* ============================================================================
   THEME SYSTEM (V12). The palette is token-driven; the whole console is
   re-coloured by swapping the block that wins on <html data-theme=...>.

   - Graphite (dark) is the DESIGNED DEFAULT and lives on bare :root, so a page
     with no JS and no stored preference renders Graphite (the server always
     stamps data-theme="graphite" too, but :root is the belt-and-braces).
   - Cream (light), 1337 |-|4><0R (green phosphor) override via [data-theme].
   - System follows the OS: light by default, Graphite under a dark OS.

   Token NAMES are held stable - inline styles in several templates read
   --good / --alert-text / --attention etc. - and re-valued onto V12's palette
   (V12 --accent->accent/attention, --crit->alert, --warn->high, --ok->good).
   ============================================================================ */
:root {
  /* -- Shape + type: shared across themes -- */
  --radius:          6px;
  --radius-sm:       4px;
  --shadow:          0 1px 0 rgba(0, 0, 0, 0.28), 0 3px 8px rgba(0, 0, 0, 0.20);
  --font-mono: "IBM Plex Mono", ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --font-sans: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  /* -- GRAPHITE (default, dark) -- */
  --bg:#1a1613; --surface:#221d18; --surface-raised:#2a241d; --surface-2:#2a241d;
  --border:#332c24; --border-bright:#493f34; --border-strong:#493f34;
  --text:#ece3d3; --text-muted:#a79c8a; --text-dim:#a79c8a; --text-faint:#8a7f6a;
  --accent:#e0a43f; --accent-hover:#efbf6a;
  --link:#e0a43f; --link-hover:#efbf6a;
  --brand:#e0a43f; --brand-hover:#efbf6a; --brand-ink:#1a1613;
  --alert:#e2705d; --alert-text:#e88b7b; --alert-dim:rgba(226,112,93,0.13); --crit:#e2705d;
  --high:#e0a24a; --high-text:#e8b56e; --high-dim:rgba(224,162,74,0.13); --warn:#e0a24a;
  --attention:#e0a43f; --attention-text:#e8b96a; --attention-dim:rgba(224,164,63,0.13);
  --good:#9fb168; --good-text:#b3c489; --good-dim:rgba(159,177,104,0.13); --ok:#9fb168;
  --info:#86b0ad; --info-text:#a0c4c1; --info-dim:rgba(134,176,173,0.13);
  --low:#8a7f6a; --low-dim:rgba(138,127,106,0.11);
  --chart-line:#e0a43f; --chart-fill:rgba(224,164,63,0.13); --chart-point-border:#1a1613;
  --chart-blue:#86b0ad; --chart-orange:#e0a24a; --chart-aqua:#9fb168;
  --trace-fill:rgba(224,164,63,0.13);
}

/* -- CREAM (light) + SYSTEM's light default -- */
:root[data-theme="cream"], :root[data-theme="system"] {
  --bg:#efe9dd; --surface:#f5efe3; --surface-raised:#e7e0cf; --surface-2:#e7e0cf;
  --border:#ddd5c3; --border-bright:#c3b89e; --border-strong:#c3b89e;
  --text:#231f16; --text-muted:#5c5545; --text-dim:#5c5545; --text-faint:#766c58;
  --accent:#a2661a; --accent-hover:#8a5414;
  --link:#a2661a; --link-hover:#8a5414;
  --brand:#a2661a; --brand-hover:#8a5414; --brand-ink:#f5efe3;
  --alert:#8c2e21; --alert-text:#8c2e21; --alert-dim:rgba(140,46,33,0.10); --crit:#8c2e21;
  --high:#a8630f; --high-text:#8a520c; --high-dim:rgba(168,99,15,0.11); --warn:#a8630f;
  --attention:#a2661a; --attention-text:#7d4f14; --attention-dim:rgba(162,102,26,0.12);
  --good:#5b6d2c; --good-text:#4a5a22; --good-dim:rgba(91,109,44,0.12); --ok:#5b6d2c;
  --info:#436565; --info-text:#436565; --info-dim:rgba(67,101,101,0.10);
  --low:#766c58; --low-dim:rgba(118,108,88,0.10);
  --shadow:0 1px 0 rgba(60,50,30,0.05), 0 3px 8px rgba(60,50,30,0.08);
  --chart-line:#a2661a; --chart-fill:rgba(162,102,26,0.14); --chart-point-border:#f5efe3;
  --chart-blue:#436565; --chart-orange:#a8630f; --chart-aqua:#5b6d2c;
  --trace-fill:rgba(162,102,26,0.14);
}

/* -- SYSTEM under a dark OS -> Graphite -- */
@media (prefers-color-scheme: dark) {
  :root[data-theme="system"] {
    --bg:#1a1613; --surface:#221d18; --surface-raised:#2a241d; --surface-2:#2a241d;
    --border:#332c24; --border-bright:#493f34; --border-strong:#493f34;
    --text:#ece3d3; --text-muted:#a79c8a; --text-dim:#a79c8a; --text-faint:#8a7f6a;
    --accent:#e0a43f; --accent-hover:#efbf6a;
    --link:#e0a43f; --link-hover:#efbf6a;
    --brand:#e0a43f; --brand-hover:#efbf6a; --brand-ink:#1a1613;
    --alert:#e2705d; --alert-text:#e88b7b; --alert-dim:rgba(226,112,93,0.13); --crit:#e2705d;
    --high:#e0a24a; --high-text:#e8b56e; --high-dim:rgba(224,162,74,0.13); --warn:#e0a24a;
    --attention:#e0a43f; --attention-text:#e8b96a; --attention-dim:rgba(224,164,63,0.13);
    --good:#9fb168; --good-text:#b3c489; --good-dim:rgba(159,177,104,0.13); --ok:#9fb168;
    --info:#86b0ad; --info-text:#a0c4c1; --info-dim:rgba(134,176,173,0.13);
    --low:#8a7f6a; --low-dim:rgba(138,127,106,0.11);
    --shadow:0 1px 0 rgba(0,0,0,0.28), 0 3px 8px rgba(0,0,0,0.20);
    --chart-line:#e0a43f; --chart-fill:rgba(224,164,63,0.13); --chart-point-border:#1a1613;
    --chart-blue:#86b0ad; --chart-orange:#e0a24a; --chart-aqua:#9fb168;
    --trace-fill:rgba(224,164,63,0.13);
  }
}

/* -- 1337 |-|4><0R: green phosphor, all-mono, glow. Effects stay scoped to this theme. -- */
:root[data-theme="hacker"] {
  --font-sans: "IBM Plex Mono", ui-monospace, "JetBrains Mono", Consolas, monospace;
  --bg:#000000; --surface:#010c01; --surface-raised:#021402; --surface-2:#021402;
  --border:#064006; --border-bright:#0a6a0a; --border-strong:#0a6a0a;
  --text:#03a062; --text-muted:#02784a; --text-dim:#02784a; --text-faint:#015a37;
  --accent:#05d67f; --accent-hover:#0affa0;
  --link:#05d67f; --link-hover:#0affa0;
  --brand:#05d67f; --brand-hover:#0affa0; --brand-ink:#000000;
  --alert:#05d67f; --alert-text:#05d67f; --alert-dim:rgba(5,214,127,0.14); --crit:#05d67f;
  --high:#03a062; --high-text:#04c074; --high-dim:rgba(3,160,98,0.14); --warn:#03a062;
  --attention:#03a062; --attention-text:#05d67f; --attention-dim:rgba(3,160,98,0.14);
  --good:#03a062; --good-text:#05d67f; --good-dim:rgba(3,160,98,0.14); --ok:#03a062;
  --info:#03a062; --info-text:#04c074; --info-dim:rgba(3,160,98,0.14);
  --low:#02784a; --low-dim:rgba(2,120,74,0.12);
  --shadow:0 0 0 1px rgba(5,214,127,0.10);
  --chart-line:#05d67f; --chart-fill:rgba(5,214,127,0.15); --chart-point-border:#000000;
  --chart-blue:#05d67f; --chart-orange:#03a062; --chart-aqua:#04c074;
  --trace-fill:rgba(5,214,127,0.16);
}
/* Phosphor glow: hacker theme only, and suppressed under reduced-motion-insensitive is irrelevant
   (it is a static shadow), but kept subtle so text stays legible. */
:root[data-theme="hacker"] body { text-shadow: 0 0 2px rgba(5,214,127,0.35); }
:root[data-theme="hacker"] .wordmark { text-shadow: 0 0 6px rgba(5,214,127,0.55); }
* { box-sizing: border-box; }
/* Contain the off-canvas evidence drawer (position:fixed, translated off-screen-right when closed)
   so it never adds page-level horizontal scroll. `clip` (not `hidden`) does not create a scroll
   container, so the sticky top nav still works. Page CONTENT reflows within the viewport on its own;
   this only holds the intentionally-off-screen drawer. */
html { overflow-x: clip; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: var(--link); text-decoration: none; }
a:hover { color: var(--link-hover); text-decoration: underline; }
:focus-visible { outline: 2px solid var(--link-hover); outline-offset: 2px; border-radius: 2px; }

/* -- Type utilities: labels recede (wide-tracked micro-caps), data advances (mono, tabular) -- */
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--text-muted); }
.faint { color: var(--text-faint); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.label {
  font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-muted); font-weight: 600;
}

/* ============================== Top navigation ============================== */
.topnav {
  display: flex;
  align-items: center;
  gap: 1.75rem;
  padding: 0.7rem 1.5rem;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, var(--surface), var(--bg));
  position: sticky;
  top: 0;
  z-index: 10;
}
.topnav .wordmark {
  font-family: var(--font-mono);
  font-weight: 700;
  letter-spacing: 0.16em;
  font-size: 0.8rem;
  color: var(--text);
  text-transform: uppercase;
}
.topnav .wordmark:hover { color: var(--link-hover); text-decoration: none; }
.topnav nav { display: flex; gap: 0.35rem; }
.topnav nav a {
  color: var(--text-muted);
  font-size: 0.82rem;
  padding: 0.3rem 0.6rem;
  border-radius: var(--radius-sm);
  border-bottom: 2px solid transparent;
}
.topnav nav a:hover { color: var(--text); text-decoration: none; background: var(--surface-raised); }
.topnav nav a.active { color: var(--text); background: var(--surface-raised); border-bottom-color: var(--link); }
.topnav .right { margin-left: auto; display: flex; align-items: center; gap: 1rem; }
/* Utility links (logout, uptime, version) are chrome, not attention - never the warm accent. */
.topnav .right a { color: var(--text-muted); }
.topnav .right a:hover { color: var(--text); }
/* The pending badge is a legitimate attention signal (work is waiting), so it keeps the amber. */
.badge {
  background: var(--attention); color: var(--brand-ink); font-size: 0.62rem; font-weight: 700;
  padding: 0.05rem 0.4rem; border-radius: 999px; margin-left: 0.35rem; font-family: var(--font-mono);
  vertical-align: 1px;
}
.nav-meta { font-size: 0.72rem; }
.nav-search input[type="text"] {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 0.35rem 0.65rem;
  font-size: 0.78rem;
  width: 170px;
}
.nav-search input[type="text"]:focus { border-color: var(--border-bright); outline: none; }
.nav-search input[type="text"]::placeholder { color: var(--text-faint); }

/* ================================= Layout ================================== */
main { max-width: 1180px; margin: 0 auto; padding: 1.6rem 1.5rem 4rem; }
/* Real weight steps (600 vs 700): a system-font stack snaps fractional weights to the nearest 100,
   so 650/620 would render identical. Headings own weight 700; body/data stay 400-600 below them. */
h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 0.35rem; }
h2 { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 1rem; }
.page-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); font-weight: 600; margin: 0 0 1rem; }
.page-sub { color: var(--text-faint); font-size: 0.8rem; margin: 0 0 1.5rem; }

/* ===================== Status band - the one thing read first ==============
   A row of cells that frames operator state. The lead cell is "waiting on you":
   the console opens on the question it exists to answer. */
.band {
  display: grid;
  grid-template-columns: 1.4fr repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 1.4rem;
  box-shadow: var(--shadow);
}
.band .cell { background: var(--surface); padding: 0.95rem 1.1rem; }
.band .cell--call { background: linear-gradient(180deg, rgba(234, 167, 44, 0.09), var(--surface)); }
.band .cell--alarm { background: linear-gradient(180deg, var(--alert-dim), var(--surface)); }
.band .cell .label { display: block; margin-bottom: 0.55rem; }
/* Inventory numbers recede to muted ink; only an actionable cell (--call) or an alarm gets bright
   warm ink and extra size, so the one number that means "act" wins the eye - not the largest count. */
.band .cell .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 1.75rem; font-weight: 700; line-height: 1; letter-spacing: -0.02em; color: var(--text-muted); }
.band .cell .v a { color: inherit; }
.band .cell .v small { font-size: 0.9rem; color: var(--text-faint); font-weight: 500; margin-left: 0.3rem; }
.band .cell .foot { margin-top: 0.5rem; font-size: 0.74rem; color: var(--text-faint); }
.v--call { color: var(--attention-text); font-size: 2.3rem; }
.v--alarm { color: var(--alert-text); font-size: 2.3rem; }
.v--ok { color: var(--good-text); }

/* -- Hero stat (dashboard/detail/feed still use it): the primary glance metric -- */
.stat-hero {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
  margin-bottom: 0.75rem;
  box-shadow: var(--shadow);
}
.stat-hero--attention { background: linear-gradient(180deg, var(--attention-dim), var(--surface)); border-color: rgba(234, 167, 44, 0.22); }
.stat-hero--nominal { background: linear-gradient(180deg, var(--good-dim), var(--surface)); border-color: rgba(47, 169, 106, 0.18); }
.stat-hero .stat-hero-value { font-family: var(--font-mono); font-size: 2rem; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.stat-hero--attention .stat-hero-value, .stat-hero--attention .stat-hero-value a { color: var(--attention-text); }
.stat-hero--nominal .stat-hero-value, .stat-hero--nominal .stat-hero-value a { color: var(--good-text); }
.stat-hero .stat-hero-label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
.stat-hero .stat-hero-sub { margin-left: auto; display: flex; gap: 1.5rem; font-size: 0.78rem; color: var(--text-muted); }
.stat-hero .stat-hero-sub strong { color: var(--text); font-family: var(--font-mono); }

/* -- Stat row: secondary metrics. A left rule carries the one bit of state colour. -- */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.7rem; margin-bottom: 1.4rem; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.7rem 0.9rem; box-shadow: var(--shadow); }
.stat-card--good { border-left: 3px solid var(--good); }
.stat-card--attention { border-left: 3px solid var(--attention); }
.stat-card--alert { border-left: 3px solid var(--alert); }
.stat-card--info { border-left: 3px solid var(--info); }
.stat-card .label { margin-bottom: 0.35rem; }
.stat-card .value { font-family: var(--font-mono); font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; }
.stat-card svg { display: block; margin-top: 0.45rem; }

/* ================================= Panels ================================== */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 1.1rem; overflow: hidden; box-shadow: var(--shadow); }
.panel-head {
  padding: 0.6rem 0.95rem;
  font-size: 0.7rem;
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  background: var(--surface-raised);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.75rem;
}
.panel-head .dim { text-transform: none; letter-spacing: 0; font-weight: 500; }
/* --blue/--orange were categorical chart chrome; --orange in particular reused the HIGH-severity
   hue as decoration. Panel identity comes from the title, so those are neutral now. --alert stays:
   a red-capped panel is a real signal (something in that panel is wrong). */
.panel-head--blue, .panel-head--orange { }
.panel-head--alert { box-shadow: inset 0 2px 0 var(--alert); color: var(--alert-text); }
.panel-body { padding: 0.75rem 0.95rem 0.95rem; }

/* ===================== Severity tags - "what it did" =======================
   The vocabulary that makes colour mean something. Driven off signal_type on
   the route side; a tag with no severity class stays neutral grey ("noise"). */
.sev-tags { display: flex; gap: 0.35rem; flex-wrap: wrap; align-items: center; }
.sev {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  line-height: 1.5;
  padding: 0.05rem 0.45rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-bright);
  color: var(--text-muted);
  white-space: nowrap;
}
.sev--crit  { color: var(--alert-text);     border-color: rgba(229, 72, 77, 0.40);  background: var(--alert-dim); }
.sev--high  { color: var(--high-text);      border-color: rgba(242, 117, 29, 0.38); background: var(--high-dim); }
.sev--watch { color: var(--attention-text); border-color: rgba(234, 167, 44, 0.34); background: var(--attention-dim); }
.sev--low   { color: var(--text-muted);     border-color: var(--border-bright);     background: transparent; }
/* A small solid dot for compact severity marking (e.g. a row's worst signal). */
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--low); vertical-align: 0.02em; }
.dot--crit { background: var(--alert); } .dot--high { background: var(--high); }
.dot--watch { background: var(--attention); } .dot--low { background: var(--low); }

/* ===================== Activity strip - the signature =======================
   24 cells, one per hour. Colour = worst signal that hour; height = volume.
   Reads burst / sustained / one-shot at a glance without parsing timestamps. */
.strip { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 26px; }
/* Empty hour: a dim stub clearly BELOW the low-severity grey, so "nothing happened" reads distinct
   from "a scan happened". Height (inline) encodes volume; the route should scale it sqrt/log so a
   5-event hour still clears the floor and a 500-event hour does not swamp the strip. */
.strip i { width: 4px; min-height: 2px; background: #2a333c; border-radius: 1px; display: block; }
.strip i.s1 { background: var(--low); }
.strip i.s2 { background: var(--attention); }
.strip i.s3 { background: var(--high); }
.strip i.s4 { background: var(--alert); }
/* Severity must beat volume: a HIGH/CRIT hour gets a height FLOOR so it can never render shorter
   than a tall scan bar, and a light top cap gives a NON-COLOUR channel (survives red-green CB and
   ranks the worst hours) - height alone already carries volume, so the cap does the ordering work. */
.strip i.s3 { min-height: 15px; box-shadow: inset 0 2px 0 rgba(231, 237, 243, 0.30); }
.strip i.s4 { min-height: 20px; box-shadow: inset 0 3px 0 rgba(231, 237, 243, 0.55); }

/* -- Range selector (chart time windows) -- */
.range-selector { display: flex; gap: 0.3rem; flex-wrap: wrap; }
.range-btn {
  font-family: var(--font-mono);
  font-size: 0.66rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  border: 1px solid var(--border);
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 0.2rem 0.55rem;
  cursor: pointer;
}
.range-btn:hover { color: var(--text); border-color: var(--border-bright); text-decoration: none; }
/* Selected view = calm cool accent, not a warm fill. A view switch is wayfinding, not an alert. */
.range-btn.active { color: var(--text); border-color: var(--link); background: var(--surface-raised); font-weight: 600; }

/* -- Download control: two dropdowns + one button, not ten buttons repeated -- */
.dl { display: inline-flex; align-items: center; gap: 0.4rem; }
.dl select {
  background: var(--bg); color: var(--text-muted); border: 1px solid var(--border-bright);
  border-radius: var(--radius-sm); padding: 0.25rem 0.45rem; font-family: var(--font-mono); font-size: 0.68rem;
}
.dl select:focus { border-color: var(--brand); outline: none; color: var(--text); }
.dl .dl-go {
  background: var(--bg); border: 1px solid var(--border-bright); border-radius: var(--radius-sm);
  padding: 0.25rem 0.7rem; font-size: 0.66rem; color: var(--text-muted); text-decoration: none;
  font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-family: var(--font-sans); cursor: pointer;
}
.dl .dl-go:hover { border-color: var(--brand); color: var(--text); text-decoration: none; }

/* -- Tab bar -- */
.tab-bar { display: flex; gap: 0.25rem; margin: 0.9rem 0 1.1rem; border-bottom: 1px solid var(--border); }
.tab { font-size: 0.82rem; font-weight: 550; color: var(--text-muted); padding: 0.45rem 0.8rem; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--text); border-color: var(--border-bright); text-decoration: none; }
.tab.active { color: var(--text); border-color: var(--link); }

/* ================================= Tables ================================== */
table { width: 100%; border-collapse: collapse; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.panel table { border-collapse: collapse; }
.panel .table-wrap { border: none; border-radius: 0; box-shadow: none; }
th, td { padding: 0.6rem 0.9rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
th { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); font-weight: 600; background: var(--surface-raised); white-space: nowrap; }
th a { color: var(--text-muted); }
th a:hover { color: var(--text); }
th a.active { color: var(--brand); }
tbody tr { transition: background-color 90ms ease; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: rgba(255, 255, 255, 0.022); }
td.ip, td.score, td.seen, td.count { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
/* Quantity columns right-align so digits stack by place value (tabular-nums only pays off then). */
th.count, td.count { text-align: right; }
td.ip a { color: var(--text); }
td.ip a:hover { color: var(--brand); }

/* -- Meters (score bars) -- */
.meter { position: relative; width: 54px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 0.5rem; }
/* Score bar rides the same heat ramp as everything else: grey (noise) -> amber -> orange -> red.
   Blue never appears on the risk axis. Templates pick the band from the score. */
.meter-fill { position: absolute; inset: 0; border-radius: 3px; width: var(--pct, 0%); background: var(--low); }
.meter-fill--warn { background: var(--attention); }
.meter-fill--high { background: var(--high); }
.meter-fill--crit { background: var(--alert); }
.table-compact th, .table-compact td { padding: 0.45rem 0.75rem; font-size: 0.82rem; }
.table-compact .meter { width: 44px; height: 4px; }

/* -- Session cards (detail page evidence timeline) -- */
.session-card { border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 0.5rem; overflow: hidden; }
.session-card:last-child { margin-bottom: 0; }
.session-card > summary.session-header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1rem;
  padding: 0.6rem 0.9rem; cursor: pointer; font-size: 0.8rem; background: var(--surface-raised); list-style: none;
}
/* `display:flex` drops the native <summary> triangle; redraw it by hand. */
.session-card > summary.session-header::-webkit-details-marker { display: none; }
.session-card > summary.session-header::before { content: "\25B8"; flex: 0 0 auto; color: var(--text-muted); font-size: 0.7rem; transition: transform 120ms ease; }
.session-card[open] > summary.session-header::before { transform: rotate(90deg); }
.session-card > summary.session-header:hover { background: var(--border); }
.session-card[open] > summary.session-header { border-bottom: 1px solid var(--border); }
.session-time { color: var(--text); }
.session-meta { color: var(--text-muted); }
.session-user { color: var(--info-text); }
.session-count { margin-left: auto; white-space: nowrap; }
.evidence-table th, .evidence-table td { padding: 0.45rem 0.75rem; font-size: 0.8rem; }
.raw-toggle { display: inline-block; }
.raw-toggle > summary { cursor: pointer; color: var(--text-muted); font-size: 0.72rem; }
.raw-toggle > summary:hover { color: var(--text); }
.raw-json { font-family: var(--font-mono); font-size: 0.72rem; white-space: pre-wrap; word-break: break-all; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.5rem 0.6rem; margin: 0.4rem 0 0; max-width: 520px; }

/* -- Tier pills: mapped onto the ramp (aggressive=hot, standard=watch) -- */
.tier { display: inline-block; padding: 0.1rem 0.5rem; border-radius: var(--radius-sm); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
.tier-aggressive { background: var(--alert-dim); color: var(--alert-text); }
.tier-standard { background: var(--attention-dim); color: var(--attention-text); }
.tier-none { color: var(--text-faint); }

/* -- State pills -- */
.state-pill { display: inline-block; padding: 0.1rem 0.5rem; border-radius: var(--radius-sm); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.03em; }
.state-approved { background: var(--good-dim); color: var(--good-text); }
.state-rejected { background: var(--alert-dim); color: var(--alert-text); }
.state-snoozed { background: var(--info-dim); color: var(--info-text); }

/* -- Charts -- */
.panel .chart-box { height: 180px; margin: 0; }
.panel .chart-box-sm { height: 200px; }
.panel .chart-box-compact { height: 110px; margin: 0; }
.chart-box { position: relative; height: 200px; margin: 0.75rem 0 0.5rem; }
.chart-box-sm { position: relative; height: 220px; }
.chart-box-compact { position: relative; height: 110px; margin: 0.75rem 0 0.5rem; }

.section-title { font-size: 0.9rem; font-weight: 600; margin: 1.75rem 0 0.75rem; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

/* -- Evidence timeline "Load more" -- */
#load-more-container { padding: 0.7rem 0.9rem; text-align: center; border-top: 1px solid var(--border); }
#load-more-container:empty { display: none; }
.load-more { width: 100%; max-width: 220px; }

/* ============================ Actions & buttons ============================ */
.actions { display: flex; flex-direction: column; gap: 0.4rem; min-width: 220px; }
.actions textarea {
  width: 100%; resize: vertical; min-height: 1.6rem; height: 1.6rem; transition: height 150ms ease;
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  font-family: var(--font-sans); font-size: 0.8rem; border-radius: var(--radius-sm); padding: 0.35rem 0.5rem;
}
.actions textarea:focus { height: 3.5rem; border-color: var(--border-bright); outline: none; }
.actions .buttons { display: flex; gap: 0.4rem; flex-wrap: wrap; }
button, .btn {
  font-family: var(--font-sans); font-size: 0.78rem; font-weight: 600;
  border: 1px solid var(--border); background: var(--surface-raised); color: var(--text);
  border-radius: var(--radius-sm); padding: 0.35rem 0.7rem; cursor: pointer;
  transition: background-color 100ms ease, border-color 100ms ease;
}
button:hover { border-color: var(--text-muted); }
.btn-approve { border-color: var(--good); color: var(--good-text); background: transparent; }
.btn-approve:hover { background: var(--good-dim); }
.btn-reject { border-color: var(--alert); color: var(--alert-text); background: transparent; }
.btn-reject:hover { background: var(--alert-dim); }
.btn-snooze { border-color: var(--info); color: var(--info-text); background: transparent; }
.btn-snooze:hover { background: var(--info-dim); }
.btn-danger { border-color: var(--alert); color: var(--alert-text); background: transparent; cursor: pointer; }
.btn-danger:hover { background: var(--alert-dim); }

/* ============================== Filter form ================================ */
.filter-form {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 0.9rem 1rem; margin-bottom: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.6rem 0.8rem; align-items: flex-end;
  box-shadow: var(--shadow);
}
.filter-form .field { display: flex; flex-direction: column; gap: 0.25rem; }
.filter-form label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
.filter-form input[type="text"], .filter-form input[type="date"], .filter-form select {
  background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 0.4rem 0.55rem; font-size: 0.82rem;
}
.filter-form input:focus, .filter-form select:focus { border-color: var(--border-bright); outline: none; }
.search-mode-tabs { margin-bottom: 1rem; }

/* =============================== Log viewer ================================ */
.log-viewer { height: 65vh; min-height: 320px; overflow-y: auto; background: var(--bg); padding: 0.4rem 0; }
.log-lines { display: flex; flex-direction: column; }
.log-line {
  display: flex; align-items: baseline; gap: 0.6rem; padding: 0.15rem 0.9rem;
  font-family: var(--font-mono); font-size: 0.78rem; white-space: pre-wrap; word-break: break-word; border-left: 2px solid transparent;
}
.log-line.level-error { background: var(--alert-dim); border-left-color: var(--alert); }
.log-line.level-warn { background: var(--attention-dim); border-left-color: var(--attention); }
.log-time { color: var(--text-faint); flex: 0 0 auto; }
.log-level-badge { flex: 0 0 auto; display: inline-block; min-width: 3.6em; text-align: center; font-weight: 700; font-size: 0.68rem; letter-spacing: 0.03em; padding: 0 0.3em; border-radius: 3px; color: var(--text-muted); }
.log-level-badge-error { background: var(--alert-dim); color: var(--alert-text); }
.log-level-badge-warn { background: var(--attention-dim); color: var(--attention-text); }
.log-level-badge-info { color: var(--text-muted); }
.log-level-badge-debug, .log-level-badge-trace { color: var(--text-faint); }
.log-target { color: var(--text-faint); flex: 0 0 auto; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-message { color: var(--text-muted); flex: 1 1 auto; }
.log-line.level-error .log-message { color: var(--alert-text); }
.log-line.level-warn .log-message { color: var(--attention-text); }
.log-line.level-debug .log-message, .log-line.level-trace .log-message { color: var(--text-faint); }
#log-connection-status { margin-left: 0.6rem; text-transform: none; letter-spacing: 0; }
#log-pause-toggle.active { border-color: var(--brand); color: var(--brand); }

/* -- Empty states -- */
.empty { color: var(--text-muted); padding: 2rem 1rem; text-align: center; border: 1px dashed var(--border); border-radius: var(--radius); }
.empty-line { color: var(--text-muted); font-family: var(--font-mono); font-size: 0.82rem; padding: 1.25rem 0.9rem; }
/* Soft-failed panels banner (routes::degraded): amber = "wants the operator", same ramp as review. */
.degraded { background: var(--high-dim); border: 1px solid var(--high); color: var(--high-text); font-family: var(--font-mono); font-size: 0.82rem; padding: 0.6rem 0.9rem; border-radius: 4px; margin-bottom: 1rem; }

/* -- Footer & login -- */
.status-line { text-align: center; color: var(--text-faint); font-family: var(--font-mono); font-size: 0.68rem; padding: 1.5rem 0 1rem; letter-spacing: 0.03em; }
.login-shell { display: flex; align-items: center; justify-content: center; min-height: 70vh; }
.login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem 2.25rem; width: 320px; max-width: 100%; box-shadow: var(--shadow); }
.login-card h1 { font-family: var(--font-mono); letter-spacing: 0.14em; font-size: 1rem; text-transform: uppercase; color: var(--text); text-align: center; margin-bottom: 1.5rem; }
.login-card input[type="password"] { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 0.55rem 0.7rem; font-size: 0.9rem; margin-bottom: 1rem; }

.login-card button { width: 100%; padding: 0.6rem; background: var(--link); border-color: var(--link); color: #0e1217; }
.login-card button:hover { background: var(--link-hover); border-color: var(--link-hover); }
.login-error { color: var(--alert-text); font-size: 0.82rem; margin-bottom: 1rem; }

@media (max-width: 720px) {
  .band { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 640px) {
  .topnav { flex-wrap: wrap; gap: 0.75rem; }
  main { padding: 1rem 1rem 2.5rem; }
  .stat-hero { flex-wrap: wrap; }
  .stat-hero .stat-hero-sub { margin-left: 0; width: 100%; }
  .grid-2 { grid-template-columns: 1fr; }
  .band { grid-template-columns: 1fr; }
  .actions { min-width: 0; }
}

/* ===================== V12 additions: nav dropdown, theme switch, drawer ===== */
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Operations dropdown (native <button> + <a> menu items, keyboard-operable) */
.topnav nav .menu { position: relative; display: inline-flex; }
.navlike {
  font-family: var(--font-sans); font-size: 0.82rem; font-weight: 500; color: var(--text-muted);
  background: none; border: none; border-bottom: 2px solid transparent; padding: 0.3rem 0.6rem;
  border-radius: var(--radius-sm); cursor: pointer; display: inline-flex; align-items: center; gap: 0.3rem;
}
.navlike:hover { color: var(--text); background: var(--surface-raised); }
.navlike.active { color: var(--text); background: var(--surface-raised); border-bottom-color: var(--link); }
.menu-list {
  position: absolute; top: calc(100% + 5px); left: 0; min-width: 190px; background: var(--surface);
  border: 1px solid var(--border-bright); border-radius: var(--radius); padding: 4px; z-index: 20;
  box-shadow: var(--shadow); display: flex; flex-direction: column;
}
.menu-list[hidden] { display: none; }
.menu-list a { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.4rem 0.6rem; font-size: 0.8rem; color: var(--text-muted); border-radius: var(--radius-sm); }
.menu-list a:hover { background: var(--surface-raised); color: var(--text); text-decoration: none; }
.menu-list a[aria-current="page"] { color: var(--text); background: var(--surface-raised); }
.menu-list .hint { font-size: 0.64rem; color: var(--text-faint); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em; }

/* Theme switcher */
.theme-switch { display: inline-flex; align-items: center; }
.theme-switch select {
  background: var(--bg); color: var(--text-muted); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 0.28rem 0.5rem; font-size: 0.74rem; font-family: var(--font-sans); cursor: pointer;
}
.theme-switch select:focus { border-color: var(--border-bright); outline: none; color: var(--text); }

/* Evidence drawer */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 40; }
.scrim.open { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed; top: 0; right: 0; height: 100%; width: min(560px, 96vw); background: var(--bg);
  border-left: 1px solid var(--border-bright); transform: translateX(100%);

.drawer-eyebrow { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-muted); font-weight: 600; }
#drawer-body { padding: 1rem 1.1rem 3rem; }
.iconbtn { background: none; border: 1px solid var(--border); color: var(--text-muted); border-radius: var(--radius-sm); width: 1.9rem; height: 1.9rem; line-height: 1; font-size: 1.1rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.iconbtn:hover { color: var(--text); border-color: var(--border-bright); }
.insp { cursor: pointer; }

@media (max-width: 640px) {
  .topnav nav { flex-wrap: wrap; }
  /* The right-hand chrome (quick-search, theme switch, uptime/version, sign out) wraps to its own

  .topnav .right { flex-wrap: wrap; margin-left: 0; width: 100%; gap: 0.5rem 1rem; }

}

}
