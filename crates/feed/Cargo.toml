[package]
name = "feed"
version = "0.3.0"
edition = "2024"

[dependencies]
core-scoring = { path = "../core-scoring" }
geoip = { path = "../geoip" }
chrono = "0.4.45"
ipnet = "2.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros"] }
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3.27.0"
review = { path = "../review" }
