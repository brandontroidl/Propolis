[package]
name = "fleet"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros", "chrono"] }
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-util = "0.7.16"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
