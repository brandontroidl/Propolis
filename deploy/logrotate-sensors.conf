# logrotate policy for all Propolis native sensors.
#
# internal/design/02-sensor-framework.md's "Transport": "The producer bounds the log ... this
# layer therefore ships the rotation policy with the sensor, as a required deliverable rather
# than a deployment detail: a size cap with a retained-generation count, using a rotation mode
# the appending sensor survives". An unbounded append driven by internet-facing traffic is a
# disk-fill denial of service against the host and is trivially reachable (a flood of probes
# costs the attacker nothing and each one writes a line), so size-based rotation - not a daily/
# weekly calendar cadence - is the correct trigger here.
#
# copytruncate is the rotation mode, not a signal-based reopen, because it needs no cooperation
# from the sensor process: logrotate copies the file then truncates the original in place, so the
# sensor's already-open fd (opened once per EventEmitter::append call via O_APPEND - see
# crates/sensor-framework/src/emit.rs) keeps appending to the same inode and never needs to be
# told to reopen. The trade-off, named rather than hidden: a line the sensor appends after
# logrotate has copied the file and before it truncates it is in neither the rotated file nor the
# fresh one. That gap is the whole of the loss this mode costs when the reader is caught up (48 to
# 570 lines per rotation in the intake soak); it is accepted in exchange for zero sensor-side
# rotation-awareness code, consistent with the sensor's hot path never depending on anything
# beyond its own local append. It is NOT a bound on what a reader that is behind loses: that is
# what the rest of this contract is for.
#
# The other half of the contract is the reader: the tailer's durable cursor (crates/log-tailer,
# "inode, offset, and a content fingerprint, rotation- and truncation-aware") detects the
# truncate and reads what it had not yet read from `<log>.1` (uncompressed until the next rotation
# because of delaycompress; the tailer opens only `.1`, and only after checking its first 256
# bytes against the stored fingerprint and its size against the read offset), then continues the
# fresh file from offset 0. Before that, a reader behind at rotation time discarded every unread
# line, which by then existed only in `.1`. If `.1` is missing, compressed, or another
# generation, the unread lines are lost, logged, and paged as intake-rotation-loss. Both halves
# are exercised together by crates/intake/tests/end_to_end.rs `rotation_survival_no_events_lost`,
# crates/log-tailer/tests/tailer_test.rs `survives_copytruncate_rotation` and
# crates/log-tailer/tests/copytruncate_drain_test.rs.
#
# Unread-input guard: the same prerotate hook also skips a log whose `.1` the reader has not
# finished reading (the next rotation would compress it unread) or whose live file holds more
# than 64 MiB the reader has not read, by reading the reader's saved cursor. A log it cannot read a
# cursor for is rotated. Details and the reasoning are in deploy/logrotate-guard.sh.
#
# Free-space guard: copytruncate COPIES the log before it truncates it, so a log larger than the free
# space on its filesystem cannot be rotated - the copy fills the volume shared with the database and
# every other log, then fails. The prerotate hook runs deploy/logrotate-guard.sh for each log that is
# due for rotation, and a non-zero exit skips only that log (logrotate(8), nosharedscripts); the rest
# still rotate. That per-log scope is why this is a prerotate hook and not an ExecStartPre check in
# propolis-logrotate.service, which could only block or allow the whole run and would let one
# oversized telnet log keep every healthy sensor from rotating. Recovery for a refused log is
# docs/operations/retention.md, "A log too large to rotate".
#
# Rotation is driven by propolis-logrotate.timer (deploy/propolis-logrotate.service) with its own
# state file, so it does not depend on the distro's logrotate.timer. The `size` line below is also
# read by the daemon's sensor-log-oversized alert, which fires at three times it.
#
# Paths match each sensor's log directory (see deploy/sensor-*.service ReadWritePaths).

/var/log/propolis/catchall/events.jsonl
/var/log/propolis/ssh/events.jsonl
/var/log/propolis/telnet/events.jsonl
/var/log/propolis/redis/events.jsonl
/var/log/propolis/adb/events.jsonl
/var/log/propolis/http/events.jsonl
/var/log/propolis/ftp/events.jsonl
/var/log/propolis/smtp/events.jsonl
/var/log/propolis/tftp/events.jsonl
/var/log/propolis/mqtt/events.jsonl
/var/log/propolis/dns/events.jsonl
/var/log/propolis/cred/*.jsonl
{
    size 100M
    rotate 5
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
    prerotate
        /usr/local/sbin/propolis-logrotate-guard "$1"
    endscript
}
