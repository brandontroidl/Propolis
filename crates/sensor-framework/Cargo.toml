[package]
name = "sensor-framework"
version = "0.2.0"
edition = "2024"

[dependencies]
sensor-wire = { path = "../sensor-wire" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "fs", "time"] }
sha2 = "0.11.0"
unicode-normalization = "0.1.25"
tracing = "0.1.44"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
