{% extends "base.html" %}
{% block title %}Logs - Propolis{% endblock %}
{% block content %}
<h1>System log</h1>

<div class="filter-form">
  <div class="field">
    <label for="log-level-filter">Level</label>
    <select id="log-level-filter">
      <option value="">Any</option>
      <option value="ERROR">Error</option>
      <option value="WARN">Warn</option>
      <option value="INFO">Info</option>
      <option value="DEBUG">Debug</option>
      <option value="TRACE">Trace</option>
    </select>
  </div>
  <div class="field">
    <label for="log-text-filter">Filter</label>
    <input type="text" id="log-text-filter" placeholder="target or message text..." autocomplete="off">
  </div>
  <button type="button" id="log-pause-toggle">Pause</button>
</div>

<div class="panel">
  <div class="panel-head">Live tail<span id="log-connection-status" class="dim mono">connecting...</span></div>
  <div class="log-viewer" id="log-viewer">
    <div class="log-lines" id="log-lines">
      {% for e in entries %}
      <div class="log-line level-{{ e.level|lower }}" data-level="{{ e.level|upper }}">
        <span class="log-time mono">{{ e.timestamp }}</span>
        <span class="log-level-badge log-level-badge-{{ e.level|lower }}">{{ e.level }}</span>
        <span class="log-target mono">{{ e.target }}</span>
        <span class="log-message">{{ e.message }}</span>
      </div>
      {% else %}
      <p class="empty-line" id="log-empty">no log entries yet</p>
      {% endfor %}
    </div>
  </div>
</div>

<script src="/assets/logs.js"></script>
{% endblock %}
