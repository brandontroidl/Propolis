[package]
name = "review"
version = "0.3.0"
edition = "2024"

[dependencies]
async-trait = "0.1.91"
base64 = "0.22.1"
clap = { version = "4.6.4", features = ["derive"] }
core-scoring = { path = "../core-scoring" }
chrono = { version = "0.4.45", features = ["serde"] }
hmac = "0.13.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "form"] }
sha2 = "0.11.0"
rust_decimal = { version = "1.42.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros", "rust_decimal", "chrono", "json"] }
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3.27.0"
url = "2.5.8"
