[package]
name = "review"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.91"
core-scoring = { path = "../core-scoring" }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "form"] }
rust_decimal = { version = "1.42.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros", "rust_decimal", "chrono", "json"] }
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
url = "2.5.8"
