[toolchain]
# Pinned to an exact version for reproducible builds - a security platform should not float across
# rustc releases (and "stable" locally resolved to a newer toolchain that does not compile this code
# cleanly). 1.96.1 is the version sub-project 1 was built and validated on. Bump deliberately, re-running
# the full gate. rustup provides matched rustc + clippy + rustfmt for it.
channel = "1.96.1"
components = ["clippy", "rustfmt"]
