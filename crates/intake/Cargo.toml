[package]
name = "intake"
version = "0.1.0"
edition = "2024"

[dependencies]
sensor-wire = { path = "../sensor-wire" }
core-scoring = { path = "../core-scoring" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "fs", "time", "io-util"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros"] }
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.27.0"
