name: CI

# Quality gate for the Propolis workspace: formatting, lint (clippy deny-warnings), and the full
# test suite against a real PostgreSQL. Runs on every push and pull request so nothing merges
# un-gated. The toolchain is pinned via rust-toolchain.toml (matched rustc + clippy + rustfmt).
#
# Supply-chain hardening: every action is pinned to a commit SHA (a moved or compromised tag cannot
# swap it out), the postgres image is pinned to a digest, and build/test use --locked (frozen
# lockfile). Update these pins deliberately, reviewing the diff.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18@sha256:32ca0af8e77bfb8c6610c488e4691f83f972a3e9e64d3b02facf3ab111ad5500
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # sqlx::test provisions a fresh database per test on this server (superuser, trust auth).
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned Rust toolchain + components
        uses: dtolnay/rust-toolchain@2fe4ca74464c5902a4f6e302d0a619b4ea911ccc # 1.96.1 branch, 2026-07-16
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests (serial, frozen lockfile)
        run: cargo test --workspace --locked -- --test-threads=1
